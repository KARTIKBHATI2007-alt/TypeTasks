<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f9">
  <title>TypeTasks Plus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-card">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">✓</div>
      <div><p class="eyebrow">YOUR SPACE, IN ORDER</p><h1>TypeTasks <span>Plus</span></h1></div>
    </header>
    <p class="intro">A little progress, one task at a time.</p>
    <form id="task-form" class="task-form">
      <label class="sr-only" for="title">Task title</label>
      <input id="title" name="title" type="text" placeholder="What needs to get done?" required maxlength="200" autocomplete="off">
      <div class="form-options">
        <label class="field-label" for="priority">Priority</label>
        <select id="priority" name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
        <label class="field-label due-label" for="due-date">Due</label>
        <input id="due-date" name="dueDate" type="date" aria-label="Optional due date">
        <button class="add-button" type="submit"><span aria-hidden="true">＋</span> Add task</button>
      </div>
    </form>
    <section class="tasks-section" aria-label="Tasks">
      <div id="filters" class="filters" aria-label="Filter tasks"></div>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty-state" hidden><span class="empty-icon" aria-hidden="true">✦</span><br>No tasks here yet.<br><span>Add a task to get started.</span></p>
    </section>
    <footer>Small steps add up. You’ve got this.</footer>
  </main>
  <script type="module" src="dist/app.js"></script>
</body>
</html>
